services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskhub
      POSTGRES_USER: taskhub
      POSTGRES_PASSWORD: taskhub
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskhub"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - taskhub_postgres:/var/lib/postgresql/data

volumes:
  taskhub_postgres:
