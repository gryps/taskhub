[project]
name = "langgraph-worker"
version = "0.1.0"
description = "Gryps lightweight worker node"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools]
packages = ["worker"]
