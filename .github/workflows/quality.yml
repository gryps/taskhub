name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskhub
          POSTGRES_USER: taskhub
          POSTGRES_PASSWORD: taskhub-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskhub -d taskhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TASKHUB_TEST_POSTGRES_DSN: postgresql://taskhub:taskhub-ci@127.0.0.1:5432/taskhub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskhub-web/package-lock.json
      - run: npm ci --prefix taskhub-web
      - run: npm --prefix taskhub-web test
      - run: npm --prefix taskhub-web run build

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskhub
          POSTGRES_USER: taskhub
          POSTGRES_PASSWORD: taskhub-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskhub -d taskhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TASKHUB_TEST_BROWSER: "1"
      TASKHUB_TEST_POSTGRES_DSN: postgresql://taskhub:taskhub-ci@127.0.0.1:5432/taskhub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskhub-web/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,browser]'
      - run: python -m playwright install --with-deps chromium
      - run: npm ci --prefix taskhub-web
      - run: npm --prefix taskhub-web run build
      - run: python -m pytest tests/test_*_browser.py
