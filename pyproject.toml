[project]
name = "langgraph-control"
version = "0.1.0"
description = "Gryps LangGraph control service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
package = false
