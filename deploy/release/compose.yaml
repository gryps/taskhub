name: taskhub

services:
  postgres:
    image: ${TASKHUB_POSTGRES_IMAGE:-postgres:16-alpine}
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskhub
      POSTGRES_USER: taskhub
      POSTGRES_PASSWORD: ${TASKHUB_POSTGRES_PASSWORD:?TASKHUB_POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskhub -d taskhub"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  controller:
    image: ${TASKHUB_SEED_IMAGE:-taskhub-seed:0.1.0-alpha}
    pull_policy: never
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    ports:
      - "${TASKHUB_PORT:-8200}:8200"
    environment:
      TASKHUB_ENV: seed
      TASKHUB_CHECKPOINTER: postgres
      TASKHUB_PRODUCTION_ORCHESTRATION_ENABLED: ${TASKHUB_PRODUCTION_ORCHESTRATION_ENABLED:-false}
      TASKHUB_POSTGRES_DSN: postgresql://taskhub:${TASKHUB_POSTGRES_PASSWORD}@postgres:5432/taskhub
      TASKHUB_PROVIDER: deterministic
      TASKHUB_ADMIN_TOKEN: ${TASKHUB_ADMIN_TOKEN:?TASKHUB_ADMIN_TOKEN is required}
      TASKHUB_ADMIN_PASSWORD_FILE: /var/lib/taskhub/config/admin-password.json
      TASKHUB_SESSION_SECRET: ${TASKHUB_SESSION_SECRET:?TASKHUB_SESSION_SECRET is required}
      TASKHUB_CONFIG_ENCRYPTION_KEY: ${TASKHUB_CONFIG_ENCRYPTION_KEY:?TASKHUB_CONFIG_ENCRYPTION_KEY is required}
      TASKHUB_COOKIE_SECURE: ${TASKHUB_COOKIE_SECURE:-true}
      TASKHUB_ENFORCE_HTTPS: ${TASKHUB_ENFORCE_HTTPS:-true}
      TASKHUB_TLS_CERT_FILE: ${TASKHUB_TLS_CERT_FILE:-/run/taskhub/tls/taskhub.crt}
      TASKHUB_TLS_KEY_FILE: ${TASKHUB_TLS_KEY_FILE:-/run/taskhub/tls/taskhub.key}
      TASKHUB_TRUSTED_HOSTS: ${TASKHUB_TRUSTED_HOSTS:-*}
      TASKHUB_USERS_FILE: /var/lib/taskhub/config/users.json
      TASKHUB_SESSION_STATE_FILE: /var/lib/taskhub/state/sessions.json
      TASKHUB_SESSION_SIGNING_KEYS_FILE: /var/lib/taskhub/config/session-signing-keys.json
      TASKHUB_SESSION_IDLE_SECONDS: ${TASKHUB_SESSION_IDLE_SECONDS:-1800}
      TASKHUB_SESSION_ABSOLUTE_SECONDS: ${TASKHUB_SESSION_ABSOLUTE_SECONDS:-43200}
      TASKHUB_LOGIN_MAX_FAILURES: ${TASKHUB_LOGIN_MAX_FAILURES:-5}
      TASKHUB_LOGIN_WINDOW_SECONDS: ${TASKHUB_LOGIN_WINDOW_SECONDS:-900}
      TASKHUB_LOGIN_LOCK_SECONDS: ${TASKHUB_LOGIN_LOCK_SECONDS:-900}
      TASKHUB_PROVIDER_SECRETS_FILE: /var/lib/taskhub/config/providers.env
      TASKHUB_PROVIDER_WORKDIR: /var/lib/taskhub/repositories
      TASKHUB_PROJECTS_FILE: /var/lib/taskhub/config/projects.json
      TASKHUB_NODES_FILE: /var/lib/taskhub/config/nodes.json
      TASKHUB_NODE_STATE_FILE: /var/lib/taskhub/state/node-state.json
      TASKHUB_OPERATIONS_LOG_FILE: /var/lib/taskhub/state/operations.jsonl
      TASKHUB_NODE_CREDENTIALS_FILE: /var/lib/taskhub/config/node-credentials.json
      TASKHUB_CONTAINER_PROVISIONING_ENABLED: "true"
      TASKHUB_DOCKER_SOCKET: http://docker-proxy:2375
      TASKHUB_DOCKER_NETWORK: ${TASKHUB_DOCKER_NETWORK:-taskhub_default}
      TASKHUB_NODE_CONTAINER_IMAGE: ${TASKHUB_NODE_IMAGE:-taskhub-node:0.1.0-alpha}
      TASKHUB_PROVIDER_HEALTH_FILE: /var/lib/taskhub/state/provider-health.json
      TASKHUB_MANAGED_REPOSITORY_ROOT: /var/lib/taskhub/repositories
      TASKHUB_WORKSPACE_ROOT: /var/lib/taskhub/workspaces
      TASKHUB_ARTIFACT_ROOT: /var/lib/taskhub/artifacts
      TASKHUB_MODEL_ACCOUNT_ROOT: /var/lib/taskhub/config/model-accounts
      TASKHUB_CODEX_CLI_BIN: /usr/local/bin/codex
      TASKHUB_OPENAI_PROXY_URL: ${TASKHUB_OPENAI_PROXY_URL:-}
      TASKHUB_WORKER_MODE: local
      TASKHUB_TEST_RUNNER: scheduled
      TASKHUB_SELF_DEPLOY_ENABLED: "false"
    volumes:
      - taskhub-data:/var/lib/taskhub
      - ${TASKHUB_TLS_DIRECTORY:-./tls}:/run/taskhub/tls:ro

  docker-proxy:
    image: ${TASKHUB_DOCKER_PROXY_IMAGE:-ghcr.io/tecnativa/docker-socket-proxy:v0.5.0}
    pull_policy: never
    restart: unless-stopped
    privileged: true
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      VERSION: 1
      PING: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      ALLOW_PAUSE: 0
      ALLOW_UNPAUSE: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres-data:
    name: ${TASKHUB_POSTGRES_VOLUME:-taskhub-postgres-data}
  taskhub-data:
    name: ${TASKHUB_DATA_VOLUME:-taskhub-data}
